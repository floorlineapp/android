name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Runs the unit tests AND records the UI screenshots in a single task
      # invocation. Running testDebugUnitTest separately first would leave this
      # task UP-TO-DATE and silently capture nothing.
      - name: Unit tests + render UI screenshots
        run: |
          set -o pipefail
          ./gradlew :app:recordRoborazziDebug --stacktrace 2>&1 | tee build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      - name: List rendered screenshots
        if: always()
        run: ls -la screenshots/ 2>/dev/null || echo "no screenshots directory"

      # Publicly visible error surface: compile/test failures become annotations
      # readable without signing in (log bodies are auth-gated on github.com).
      - name: Surface errors as annotations
        if: always()
        run: |
          grep -E "^e: |error:|FAILED|FAILURE:|Caused by:|Unresolved reference" build.log \
            | head -60 | sed 's/::/-/g' | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      # Commit the rendered screens back to the repo. Artifact downloads are not
      # reachable from every environment; a commit always is.
      - name: Publish screenshots to repo
        if: always()
        run: |
          if [ -d screenshots ] && [ -n "$(ls -A screenshots 2>/dev/null)" ]; then
            git config user.name "floor-ci"
            git config user.email "ci@users.noreply.github.com"
            git add -f screenshots
            if ! git diff --cached --quiet; then
              git commit -m "CI: update UI screenshots [skip ci]"
              git push origin HEAD:main || echo "screenshot push skipped"
            else
              echo "screenshots unchanged"
            fi
          else
            echo "no screenshots produced"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
          retention-days: 14

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-floor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
