name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee -a build.log

      # Publicly visible error surface: compile/test failures become annotations
      # readable without signing in (log bodies are auth-gated on github.com).
      - name: Surface errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|FAILURE:|Caused by:|Unresolved reference" build.log \
            | head -60 | sed 's/::/-/g' | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: the-floor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
